global:
  scrape_interval: 30s

scrape_configs:
  - job_name: bit-service
    metrics_path: /metrics
    static_configs:
      - targets: [app:4000]

  - job_name: bit
    metrics_path: /api/metrics
    http_headers:
      X-Api-Key:
        files:
          - /etc/prometheus/api-key
    static_configs:
      - targets: [app:4000]
